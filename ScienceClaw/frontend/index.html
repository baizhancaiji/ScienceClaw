<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScienceClaw</title>
  <style>
    .app-startup {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-startup__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .app-startup__mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      position: relative;
    }

    .app-startup__mark::after {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      animation: app-startup-spin 0.8s linear infinite;
    }

    .app-startup__title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      color: #0f172a;
    }

    .app-startup__text {
      font-size: 13px;
      color: #64748b;
    }

    @keyframes app-startup-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      .app-startup {
        background: #0f172a;
        color: #cbd5e1;
      }

      .app-startup__mark {
        background: #111827;
        border-color: #334155;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }

      .app-startup__title {
        color: #f8fafc;
      }

      .app-startup__text {
        color: #94a3b8;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="app-startup" role="status" aria-live="polite">
      <div class="app-startup__content">
        <div class="app-startup__mark" aria-hidden="true"></div>
        <div class="app-startup__title">ScienceClaw</div>
        <div class="app-startup__text">正在加载工作台...</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
